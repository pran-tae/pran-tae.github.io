name: Refresh feeds

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install a real browser (Letterboxd's sort pages 403 plain HTTP)
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Refresh flicks and jams
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python3 scripts/refresh_feeds.py
      - name: Commit if changed
        run: |
          git config user.name "feed-refresh"
          git config user.email "actions@users.noreply.github.com"
          if ! git diff --quiet; then
            git add -A
            git commit -m "Refresh flicks and jams"
            git pull --rebase origin main
            git push
          else
            echo "No changes."
          fi
